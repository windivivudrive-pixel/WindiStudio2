<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windi Connect</title><style>
@font-face{font-family:CallingCode;src:url('SVN-Calling Code Regular.otf')}*{box-sizing:border-box}:root{--ink:#26342f;--line:#344b41;--cream:#fff9e9;--green:#49a36e;--pink:#f15986;--blue:#cce6f8;--yellow:#f3ca60}body{width:420px;min-height:520px;margin:0;padding:14px;color:var(--ink);font:13px CallingCode,monospace;background-color:var(--blue);background-image:linear-gradient(#fff8 1px,transparent 1px),linear-gradient(90deg,#fff8 1px,transparent 1px);background-size:28px 28px}.window{overflow:hidden;border:2px solid var(--line);border-radius:15px;background:var(--cream);box-shadow:5px 5px 0 #344b4138}.title{height:42px;padding:0 13px;display:flex;align-items:center;gap:7px;background:var(--green);border-bottom:2px solid var(--line)}.dot{width:9px;height:9px;border:1.5px solid var(--line);border-radius:50%;background:#ffffff88}.title strong{margin-left:4px;font-size:14px}.title span{margin-left:auto;font-size:10px}.content{padding:15px}.intro{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:13px}.intro h1{font-size:21px;margin:0;letter-spacing:-.06em}.intro p{margin:4px 0 0;color:#62706a;font-size:10px}.summary{max-width:160px;text-align:right;font-size:10px;line-height:1.4}.providers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.provider-card{padding:11px;border:1.5px solid var(--line);border-radius:11px;background:#fffdf5}.provider-card.offline{background:#fff3f4}.provider-head{display:flex;justify-content:space-between;gap:5px}.provider-head>div{display:flex;align-items:center;gap:7px}.provider-head i{width:9px;height:9px;border:1.5px solid var(--line);border-radius:50%;background:var(--green)}.provider-card.offline i{background:var(--pink)}.provider-head>span{font-size:8px;padding:3px 5px;border:1px solid var(--line);border-radius:999px;background:var(--yellow)}.provider-card p{min-height:42px;margin:9px 0;color:#62706a;font-size:9px;line-height:1.45}.adapter-status{margin:-2px 0 8px;padding:5px 6px;border:1px dashed #344b4166;border-radius:6px;background:#fff5cf;font-size:8px;line-height:1.35}.adapter-status.ready{background:#e5f4e9}.mini-metrics{display:flex;flex-wrap:wrap;gap:4px}.mini-metrics span{font-size:8px;padding:3px 5px;background:#e8f2eb;border-radius:5px}.provider-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}.provider-actions button{min-height:29px;border:1.5px solid var(--line);border-radius:7px;background:var(--cream);font:9px CallingCode;cursor:pointer}.provider-actions button:first-child{background:var(--green)}.section{margin-top:14px;padding-top:13px;border-top:1.5px dashed #344b4166}.section h2{margin:0 0 8px;font-size:11px}.recent{display:grid;gap:4px}.asset{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;padding:7px;border:1px solid #344b4144;border-radius:8px;background:#fffdf5}.asset b{display:grid;place-items:center;width:25px;height:25px;border:1.5px solid var(--line);border-radius:7px;background:var(--yellow)}.asset strong,.asset small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.asset strong{font-size:10px}.asset small{color:#62706a;font-size:8px;margin-top:2px}.empty{padding:11px;border:1.5px dashed #344b4177;border-radius:9px;color:#62706a;font-size:10px;line-height:1.45}.foot{margin-top:12px;font-size:9px;color:#62706a}.foot code{color:var(--ink)}
</style></head><body><main class="window"><header class="title"><i class="dot"></i><i class="dot"></i><i class="dot"></i><strong>Windi Connect</strong><span>FLOW + CHATGPT</span></header><div class="content"><div class="intro"><div><h1>Trung tâm hình ảnh</h1><p>Một extension cho mọi Windi project.</p></div><div class="summary" id="summary">Đang kiểm tra…</div></div><div class="providers" id="providers"></div><section class="section"><h2>Ảnh vừa lưu</h2><div class="recent" id="recent"></div></section><div class="foot">Prompt và output luôn đến từ <code>windi</code>; popup chỉ hiển thị trạng thái để tránh lẫn project.</div></div></main><script src="popup.js" type="module"></script></body></html>
