name = "windi-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Routes - you can customize your domain here
# routes = [
#   { pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

[vars]
# Non-secret variables can go here
# ENVIRONMENT = "production"
R2_PUBLIC_DOMAIN = "https://img.windistudio.app"

# R2 Bucket Binding - for storing Seedream images permanently
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "windi-bucket"

# Secret variables should be set via `wrangler secret put`
# Run these commands after deployment:
# wrangler secret put GEMINI_API_KEY
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# 
# === VERTEX AI SECRETS (Optional: To use $300 Trial on GCP instead of Gemini API) ===
# wrangler secret put VERTEX_PROJECT_ID
# wrangler secret put VERTEX_LOCATION
# wrangler secret put VERTEX_CLIENT_EMAIL
# wrangler secret put VERTEX_PRIVATE_KEY
