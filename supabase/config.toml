
[functions.ingest-news]
enabled = true
verify_jwt = true
import_map = "./functions/ingest-news/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ingest-news/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ingest-news/*.html" ]

# Custom server-only bearer token is checked inside the worker.
[functions.voice-demo-cleanup]
enabled = true
verify_jwt = false
entrypoint = "./functions/voice-demo-cleanup/index.ts"
